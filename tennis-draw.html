<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>🎾 テニス練習試合ドロー</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F0F7F2; font-family: 'Segoe UI', system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const C = {
      court:   "#1A6B3C",
      courtLt: "#2E8B57",
      turf:    "#E8F5EE",
      line:    "#FFFFFF",
      ball:    "#C8E63C",
      ballDk:  "#A0BB1A",
      male:    "#3B82F6",
      female:  "#EC4899",
      mixed:   "#8B5CF6",
      bye:     "#94A3B8",
      dark:    "#0F2D1C",
      muted:   "#4B7A5E",
      card:    "#FFFFFF",
      border:  "#C6E0CF",
      bg:      "#F0F7F2",
      danger:  "#EF4444",
    };

    const uid = () => Math.random().toString(36).slice(2, 8);

    const shuffle = arr => {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    };

    const pairKey  = (a, b)   => [a, b].sort().join("|");
    const matchKey = (t1, t2) => [[...t1].sort().join(","), [...t2].sort().join(",")].sort().join("||");

    // mixedPriority: true=ミックス優先, false=気にしない
    function scorePairing(t1, t2, playerMap, ph, mh, mixedPriority) {
      const isMixed = t => playerMap[t[0]]?.gender !== playerMap[t[1]]?.gender;
      const mixPenalty = mixedPriority ? 8 : 0; // 優先OFFなら性別ペナルティなし
      return (isMixed(t1) ? 0 : mixPenalty) +
             (isMixed(t2) ? 0 : mixPenalty) +
             (ph[pairKey(t1[0], t1[1])] || 0) * 4 +
             (ph[pairKey(t2[0], t2[1])] || 0) * 4 +
             (mh[matchKey(t1, t2)] || 0) * 8;
    }

    // byeGroupHistory: お休み組み合わせの履歴 { groupKey: count }
    function buildRound(players, courts, ph, mh, mixedPriority, byeGroupHistory) {
      const n        = players.length;
      const playing  = courts * 4;
      const byeCount = n - playing;

      // ── お休み選出: 加重ランダム ──────────────────────────────
      // 同じお休み組み合わせを避けるため、複数候補を試して最良を選ぶ
      let byePlayers = [];
      if (byeCount > 0) {
        const maxBye = Math.max(...players.map(p => p.byeCount || 0));
        const weighted = players.map(p => ({
          ...p,
          weight: maxBye - (p.byeCount || 0) + 1,
        }));

        let bestByeGroup = null;
        let bestByeScore = Infinity;

        for (let t = 0; t < 30; t++) {
          const pool2 = [...weighted];
          const candidate = [];
          for (let i = 0; i < byeCount; i++) {
            const totalW = pool2.reduce((s, p) => s + p.weight, 0);
            let r = Math.random() * totalW;
            let picked = pool2[pool2.length - 1];
            for (const p of pool2) { r -= p.weight; if (r <= 0) { picked = p; break; } }
            candidate.push(picked);
            pool2.splice(pool2.indexOf(picked), 1);
          }
          const gKey = candidate.map(p => p.id).sort().join(",");
          const score = byeGroupHistory[gKey] || 0;
          if (score < bestByeScore) { bestByeScore = score; bestByeGroup = candidate; }
          if (bestByeScore === 0) break;
        }
        byePlayers = bestByeGroup;
      }

      const byeIds    = new Set(byePlayers.map(p => p.id));
      const pool      = players.filter(p => !byeIds.has(p.id));
      const playerMap = Object.fromEntries(players.map(p => [p.id, p]));

      // ── 対戦組み合わせ: 80回試行して最良を採用 ───────────────
      let bestRound = null;
      let bestScore = Infinity;

      for (let t = 0; t < 80; t++) {
        const shuffled = shuffle(pool);
        const matches  = [];
        let score      = 0;

        for (let i = 0; i < shuffled.length; i += 4) {
          const [a, b, c, d] = shuffled.slice(i, i + 4).map(p => p.id);
          const options = [
            { t1: [a, b], t2: [c, d] },
            { t1: [a, c], t2: [b, d] },
            { t1: [a, d], t2: [b, c] },
          ];
          let best = options[0], bestS = Infinity;
          for (const opt of options) {
            const s = scorePairing(opt.t1, opt.t2, playerMap, ph, mh, mixedPriority);
            if (s < bestS) { bestS = s; best = opt; }
          }
          score += bestS;
          matches.push({ ...best, key: matchKey(best.t1, best.t2), id: uid() });
        }

        if (score < bestScore) { bestScore = score; bestRound = { matches, byePlayers }; }
      }

      return bestRound;
    }

    // ── UIコンポーネント ────────────────────────────────────────

    const GenderBtn = ({ value, current, onSelect }) => {
      const cfg = {
        male:   { label: "男性", color: C.male },
        female: { label: "女性", color: C.female },
      };
      const { label, color } = cfg[value];
      const active = current === value;
      return (
        <button onClick={() => onSelect(value)} style={{
          flex: 1, padding: "9px 4px", borderRadius: 10,
          border: `2px solid ${active ? color : C.border}`,
          background: active ? color + "18" : C.card,
          color: active ? color : C.muted,
          fontWeight: 700, fontSize: 14, cursor: "pointer",
          display: "flex", alignItems: "center", justifyContent: "center", gap: 4,
        }}>
          {label}
        </button>
      );
    };

    const ToggleBtn = ({ label, sub, active, color, onClick }) => (
      <button onClick={onClick} style={{
        flex: 1, padding: "10px 8px", borderRadius: 10,
        border: `2px solid ${active ? color : C.border}`,
        background: active ? color + "15" : C.card,
        color: active ? color : C.muted,
        fontWeight: 700, fontSize: 13, cursor: "pointer",
        display: "flex", flexDirection: "column", alignItems: "center", gap: 2,
      }}>
        <span>{label}</span>
        {sub && <span style={{ fontSize: 10, fontWeight: 500, opacity: 0.8 }}>{sub}</span>}
      </button>
    );

    const PlayerChip = ({ player, onRemove }) => {
      const color = player.gender === "male" ? C.male : C.female;
      return (
        <div style={{
          display: "flex", alignItems: "center", gap: 5, padding: "5px 10px 5px 8px",
          borderRadius: 20, border: `1.5px solid ${color}40`, background: color + "10",
          fontSize: 13, color: C.dark, fontWeight: 600,
        }}>
          {player.drawNumber != null && (
            <span style={{
              minWidth: 20, height: 20, borderRadius: "50%", padding: "0 3px",
              background: C.court, color: C.line,
              fontSize: 10, fontWeight: 900, lineHeight: "20px", textAlign: "center",
              flexShrink: 0,
            }}>{player.drawNumber}</span>
          )}
          {!player.anonymous && player.name}
          {onRemove && (
            <span onClick={() => onRemove(player.id)}
              style={{ cursor: "pointer", color: C.muted, fontSize: 15, lineHeight: 1, marginLeft: 2 }}>×</span>
          )}
        </div>
      );
    };

    const TeamBlock = ({ ids, playerMap, label, labelColor }) => {
      const ps = ids.map(id => playerMap[id]).filter(Boolean);
      const isMixed = ps.length === 2 && ps[0].gender !== ps[1].gender;
      return (
        <div style={{ flex: 1, textAlign: "center" }}>
          <div style={{ fontSize: 10, fontWeight: 700, color: labelColor, letterSpacing: 1.5, marginBottom: 6, textTransform: "uppercase" }}>
            {label}
          </div>
          {ps.map(p => (
            <div key={p.id} style={{
              marginBottom: 6, padding: "12px 10px", borderRadius: 10,
              background: (p.gender === "male" ? C.male : C.female) + "12",
              border: `1px solid ${(p.gender === "male" ? C.male : C.female)}30`,
              fontSize: 22, fontWeight: 700, color: C.dark,
              display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            }}>
              {p.drawNumber != null && (
                <span style={{
                  minWidth: 40, height: 40, borderRadius: "50%", padding: "0 4px",
                  background: C.court, color: C.line,
                  fontSize: 20, fontWeight: 900, lineHeight: "40px", textAlign: "center", flexShrink: 0,
                }}>{p.drawNumber}</span>
              )}
              {!p.anonymous && p.name}
            </div>
          ))}
          {isMixed && <div style={{ fontSize: 10, color: C.mixed, fontWeight: 700, marginTop: 2 }}>MIX ✓</div>}
        </div>
      );
    };

    const MatchCard = ({ match, playerMap, courtNum, done, onClick }) => {
      const t1ps = match.t1.map(id => playerMap[id]).filter(Boolean);
      const t2ps = match.t2.map(id => playerMap[id]).filter(Boolean);
      const allMixed = t1ps.length === 2 && t2ps.length === 2 &&
        t1ps[0].gender !== t1ps[1].gender && t2ps[0].gender !== t2ps[1].gender;
      return (
        <div onClick={onClick} style={{
          background: C.card, borderRadius: 14, marginBottom: 10, cursor: "pointer",
          overflow: "hidden",
          boxShadow: done ? "none" : "0 2px 12px rgba(0,0,0,0.09)",
          border: done ? `1.5px solid ${C.border}` : "2px solid transparent",
          opacity: done ? 0.55 : 1, transition: "opacity 0.2s",
        }}>
          <div style={{
            background: done ? C.muted : C.court, padding: "7px 14px",
            display: "flex", alignItems: "center", justifyContent: "space-between",
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div style={{
                width: 22, height: 22, borderRadius: "50%", background: C.ball,
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 10, fontWeight: 800, color: C.dark,
              }}>{courtNum}</div>
              <span style={{ fontSize: 11, color: "#A8D5B5", fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase" }}>
                コート {courtNum}
              </span>
            </div>
            {done
              ? <span style={{ fontSize: 11, color: C.line }}>✓ 完了</span>
              : allMixed && <span style={{ fontSize: 10, background: C.mixed+"30", color: C.mixed, fontWeight: 700, padding: "2px 8px", borderRadius: 10 }}>MIXED</span>
            }
          </div>
          <div style={{ padding: "14px 14px", display: "flex", alignItems: "center", gap: 10 }}>
            <TeamBlock ids={match.t1} playerMap={playerMap} label="チーム A" labelColor={C.court} />
            <div style={{ fontWeight: 900, color: C.court, fontSize: 22, flexShrink: 0 }}>VS</div>
            <TeamBlock ids={match.t2} playerMap={playerMap} label="チーム B" labelColor="#E74C3C" />
          </div>
        </div>
      );
    };

    const Stepper = ({ label, value, min, max, onChange }) => (
      <div style={{ flex: 1, background: C.card, borderRadius: 12, padding: "12px 10px", textAlign: "center", boxShadow: "0 1px 6px rgba(0,0,0,0.06)" }}>
        <div style={{ fontSize: 10, fontWeight: 700, color: C.muted, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 8 }}>{label}</div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
          <button onClick={() => onChange(Math.max(min, value - 1))} style={{
            width: 28, height: 28, borderRadius: 8, border: `1.5px solid ${C.border}`,
            background: C.bg, color: C.court, fontWeight: 900, fontSize: 16,
            cursor: value <= min ? "not-allowed" : "pointer", opacity: value <= min ? 0.3 : 1,
          }}>−</button>
          <span style={{ fontSize: 22, fontWeight: 900, color: C.court, minWidth: 28, textAlign: "center" }}>{value}</span>
          <button onClick={() => onChange(Math.min(max, value + 1))} style={{
            width: 28, height: 28, borderRadius: 8, border: `1.5px solid ${C.border}`,
            background: C.bg, color: C.court, fontWeight: 900, fontSize: 16,
            cursor: value >= max ? "not-allowed" : "pointer", opacity: value >= max ? 0.3 : 1,
          }}>＋</button>
        </div>
      </div>
    );

    // ── メインアプリ ────────────────────────────────────────────

    function App() {
      const [screen, setScreen]               = useState("setup");
      const [nameInput, setNameInput]         = useState("");
      const [genderInput, setGenderInput]     = useState("male");
      const [players, setPlayers]             = useState(() => {
        try {
          const saved = localStorage.getItem('tennisPlayers');
          if (saved) { localStorage.removeItem('tennisPlayers'); return JSON.parse(saved); }
        } catch {}
        return [];
      });
      const [error, setError]                 = useState("");
      const [settingCourts, setSettingCourts] = useState(1);
      const [settingRounds, setSettingRounds] = useState(20);
      const [mixedPriority, setMixedPriority] = useState(true); // ミックス優先ON/OFF
      const [rounds, setRounds]               = useState([]);
      const [currentRound, setCurrentRound]   = useState(0);
      const [doneMatches, setDoneMatches]     = useState({});

      const addPlayer = () => {
        const name = nameInput.trim();
        if (!name) return;
        if (players.some(p => p.name === name)) { setError("同じ名前が既にいます"); return; }
        setPlayers(prev => [...prev, { id: uid(), name, gender: genderInput, gamesPlayed: 0, byeCount: 0 }]);
        setNameInput("");
        setError("");
      };

      const removePlayer = id => setPlayers(prev => prev.filter(p => p.id !== id));

      const maxCourts       = Math.floor(players.length / 4);
      const effectiveCourts = Math.min(settingCourts, Math.max(1, maxCourts));

      const startTournament = () => {
        if (players.length < 4) { setError("4人以上必要です"); return; }
        const ph = {}, mh = {}, byeGroupHistory = {};
        const newRounds = [];
        let statPlayers = players.map(p => ({ ...p, gamesPlayed: 0, byeCount: 0 }));

        for (let r = 0; r < settingRounds; r++) {
          const round = buildRound(statPlayers, effectiveCourts, ph, mh, mixedPriority, byeGroupHistory);
          if (!round) break;
          newRounds.push({ ...round, index: r });

          for (const m of round.matches) {
            ph[pairKey(m.t1[0], m.t1[1])] = (ph[pairKey(m.t1[0], m.t1[1])] || 0) + 1;
            ph[pairKey(m.t2[0], m.t2[1])] = (ph[pairKey(m.t2[0], m.t2[1])] || 0) + 1;
            mh[m.key] = (mh[m.key] || 0) + 1;
          }

          // お休み組み合わせ履歴を更新
          if (round.byePlayers.length > 0) {
            const gKey = round.byePlayers.map(p => p.id).sort().join(",");
            byeGroupHistory[gKey] = (byeGroupHistory[gKey] || 0) + 1;
          }

          const playedIds = new Set(round.matches.flatMap(m => [...m.t1, ...m.t2]));
          const byeIds    = new Set(round.byePlayers.map(p => p.id));
          statPlayers = statPlayers.map(p => ({
            ...p,
            gamesPlayed: (p.gamesPlayed || 0) + (playedIds.has(p.id) ? 1 : 0),
            byeCount:    (p.byeCount    || 0) + (byeIds.has(p.id)    ? 1 : 0),
          }));
        }

        setRounds(newRounds);
        setCurrentRound(0);
        setDoneMatches({});
        setScreen("rounds");
      };

      const toggleMatchDone = (roundIdx, matchId) => {
        const key = `${roundIdx}-${matchId}`;
        setDoneMatches(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const isRoundDone = idx => {
        const r = rounds[idx];
        return r ? r.matches.every(m => doneMatches[`${idx}-${m.id}`]) : false;
      };

      const playerMap   = Object.fromEntries(players.map(p => [p.id, p]));
      const maleCount   = players.filter(p => p.gender === "male").length;
      const femaleCount = players.filter(p => p.gender === "female").length;
      const fromDraw    = players.length > 0 && players.every(p => p.anonymous || p.imported);

      const mixedRatio = (() => {
        let total = 0, mixed = 0;
        for (const r of rounds) {
          for (const m of r.matches) {
            total++;
            const t1ps = m.t1.map(id => playerMap[id]).filter(Boolean);
            const t2ps = m.t2.map(id => playerMap[id]).filter(Boolean);
            if (t1ps.length === 2 && t2ps.length === 2 &&
                t1ps[0].gender !== t1ps[1].gender && t2ps[0].gender !== t2ps[1].gender) mixed++;
          }
        }
        return total > 0 ? mixed / total : 0;
      })();

      // ── セットアップ画面 ─────────────────────────────────────
      if (screen === "setup") {
        return (
          <div style={{ minHeight: "100vh", background: C.bg, paddingBottom: 80 }}>
            <div style={{
              background: `linear-gradient(135deg, ${C.court} 0%, ${C.courtLt} 100%)`,
              padding: "30px 20px 24px", textAlign: "center",
              boxShadow: "0 4px 20px rgba(0,0,0,0.2)",
            }}>
              <div style={{ fontSize: 11, letterSpacing: 4, color: C.ball, textTransform: "uppercase", marginBottom: 4 }}>Tennis Draw</div>
              <div style={{ fontSize: 26, fontWeight: 900, color: C.line }}>🎾 練習試合 ドロー</div>
              <div style={{ fontSize: 12, color: "#A8D5B5", marginTop: 4 }}>ダブルス・重複最小化</div>
            </div>

            <div style={{ maxWidth: 480, margin: "0 auto", padding: "0 16px" }}>

              {/* プレイヤー追加 (簡易版からの遷移時は非表示) */}
              {!fromDraw && (
                <div style={{ background: C.card, borderRadius: 16, marginTop: 20, padding: "18px 16px", boxShadow: "0 2px 12px rgba(0,0,0,0.07)" }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 12 }}>プレイヤー追加</div>
                  <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                    <GenderBtn value="male"   current={genderInput} onSelect={setGenderInput} />
                    <GenderBtn value="female" current={genderInput} onSelect={setGenderInput} />
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <input
                      value={nameInput}
                      onChange={e => { setNameInput(e.target.value); setError(""); }}
                      onKeyDown={e => e.key === "Enter" && addPlayer()}
                      placeholder="名前を入力..."
                      style={{
                        flex: 1, padding: "11px 14px", borderRadius: 10,
                        border: `1.5px solid ${error ? C.danger : C.border}`,
                        fontSize: 15, outline: "none", background: C.bg, color: C.dark,
                      }}
                    />
                    <button onClick={addPlayer} style={{
                      background: C.court, color: C.line, border: "none",
                      borderRadius: 10, padding: "0 18px", fontSize: 22, cursor: "pointer", fontWeight: 700,
                    }}>+</button>
                  </div>
                  {error && <div style={{ color: C.danger, fontSize: 12, marginTop: 6 }}>⚠ {error}</div>}
                </div>
              )}

              {/* 参加者リスト */}
              {players.length > 0 && (
                <div style={{ background: C.card, borderRadius: 16, marginTop: 12, padding: "16px", boxShadow: "0 2px 12px rgba(0,0,0,0.07)" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: C.muted, letterSpacing: 2, textTransform: "uppercase" }}>
                      参加者 <span style={{ color: C.court }}>{players.length}人</span>
                      <span style={{ color: C.male, marginLeft: 8 }}>男性 {maleCount}</span>
                      <span style={{ color: C.female, marginLeft: 6 }}>女性 {femaleCount}</span>
                    </div>
                    {!fromDraw && <button onClick={() => setPlayers([])} style={{ fontSize: 11, color: C.muted, background: "none", border: "none", cursor: "pointer" }}>全削除</button>}
                  </div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
                    {players.map(p => <PlayerChip key={p.id} player={p} onRemove={fromDraw ? null : removePlayer} />)}
                  </div>
                </div>
              )}

              {/* 設定 */}
              {players.length >= 4 && (
                <div style={{ background: C.card, borderRadius: 16, marginTop: 12, padding: "16px", boxShadow: "0 2px 12px rgba(0,0,0,0.07)" }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 12 }}>設定</div>

                  {/* コート数・ラウンド数 */}
                  <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
                    <Stepper label="コート数"  value={effectiveCourts} min={1} max={maxCourts} onChange={setSettingCourts} />
                    <Stepper label="ラウンド数" value={settingRounds}   min={1} max={30}        onChange={setSettingRounds} />
                  </div>

                  {/* ミックスダブルス優先 */}
                  <div style={{ marginBottom: 10 }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: C.muted, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 8 }}>
                      ミックスダブルス
                    </div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <ToggleBtn
                        label="✦ 優先する"
                        sub="男女ペアを優先"
                        active={mixedPriority}
                        color={C.mixed}
                        onClick={() => setMixedPriority(true)}
                      />
                      <ToggleBtn
                        label="ランダム"
                        sub="性別を問わない"
                        active={!mixedPriority}
                        color={C.muted}
                        onClick={() => setMixedPriority(false)}
                      />
                    </div>
                  </div>

                  {/* プレビュー */}
                  <div style={{ padding: "8px 12px", background: C.turf, borderRadius: 8, fontSize: 12, color: C.muted }}>
                    1ラウンドあたり <strong style={{ color: C.court }}>{effectiveCourts}試合</strong>　1試合あたり <strong style={{ color: C.court }}>4人</strong>
                    {players.length % (effectiveCourts * 4) > 0 && `　お休み: ${players.length - effectiveCourts * 4}人/ラウンド`}
                  </div>
                </div>
              )}

              {/* ドロー開始ボタン */}
              <button
                onClick={startTournament}
                disabled={players.length < 4}
                style={{
                  width: "100%", marginTop: 16, padding: "16px", borderRadius: 14, border: "none",
                  cursor: players.length < 4 ? "not-allowed" : "pointer",
                  background: players.length < 4 ? C.border : `linear-gradient(135deg, ${C.ball} 0%, ${C.ballDk} 100%)`,
                  color: players.length < 4 ? C.muted : C.dark,
                  fontWeight: 900, fontSize: 17,
                  boxShadow: players.length >= 4 ? "0 4px 16px rgba(200,230,60,0.4)" : "none",
                }}
              >
                {players.length < 4 ? `あと${4 - players.length}人追加してください` : "🎲 ドロー開始"}
              </button>
            </div>
          </div>
        );
      }

      // ── ラウンド画面 ─────────────────────────────────────────
      const round       = rounds[currentRound];
      const totalRounds = rounds.length;

      return (
        <div style={{ minHeight: "100vh", background: C.bg, paddingBottom: 100 }}>
          <div style={{
            background: `linear-gradient(135deg, ${C.court} 0%, ${C.courtLt} 100%)`,
            padding: "20px 16px 16px", boxShadow: "0 4px 20px rgba(0,0,0,0.18)",
          }}>
            <div style={{ maxWidth: 480, margin: "0 auto" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <button onClick={() => setScreen("setup")} style={{
                  background: "rgba(255,255,255,0.15)", border: "none", color: C.line,
                  borderRadius: 8, padding: "6px 12px", fontSize: 13, cursor: "pointer", fontWeight: 600,
                }}>← 戻る</button>
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 11, color: C.ball, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase" }}>ラウンド</div>
                  <div style={{ fontSize: 22, fontWeight: 900, color: C.line }}>{currentRound + 1} / {totalRounds}</div>
                </div>
                <div style={{ fontSize: 11, color: C.ball, fontWeight: 700, textAlign: "right" }}>
                  {mixedPriority ? "MIX優先" : "ランダム"}<br/>
                  <span style={{ fontSize: 18, fontWeight: 900, color: C.line }}>{Math.round(mixedRatio * 100)}%</span>
                </div>
              </div>
              <div style={{ marginTop: 10, height: 4, background: "rgba(255,255,255,0.2)", borderRadius: 4 }}>
                <div style={{
                  height: "100%", borderRadius: 4, background: C.ball,
                  width: `${((currentRound + (isRoundDone(currentRound) ? 1 : 0)) / totalRounds) * 100}%`,
                  transition: "width 0.4s",
                }} />
              </div>
            </div>
          </div>

          <div style={{ maxWidth: 480, margin: "0 auto", padding: "14px 16px 0" }}>

            {/* お休みバッジ */}
            {round?.byePlayers?.length > 0 && (
              <div style={{
                background: C.card, borderRadius: 12, padding: "10px 14px", marginBottom: 12,
                display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap",
                boxShadow: "0 1px 6px rgba(0,0,0,0.06)",
              }}>
                <span style={{ fontSize: 11, fontWeight: 700, color: C.muted, letterSpacing: 1, textTransform: "uppercase" }}>😴 お休み</span>
                {round.byePlayers.map(p => (
                  <span key={p.id} style={{
                    display: "inline-flex", alignItems: "center", gap: 4,
                    padding: "3px 10px 3px 6px", borderRadius: 20, background: C.bye + "20",
                    border: `1px solid ${C.bye}40`, fontSize: 13, fontWeight: 600, color: C.dark,
                  }}>
                    {p.drawNumber != null && (
                      <span style={{
                        minWidth: 26, height: 26, borderRadius: "50%", padding: "0 3px",
                        background: C.court, color: C.line,
                        fontSize: 13, fontWeight: 900, lineHeight: "26px", textAlign: "center", flexShrink: 0,
                      }}>{p.drawNumber}</span>
                    )}
                    {!p.anonymous && p.name}
                  </span>
                ))}
              </div>
            )}

            {/* 対戦カード */}
            {round?.matches.map((m, i) => {
              const done = !!doneMatches[`${currentRound}-${m.id}`];
              return (
                <MatchCard key={m.id} match={m} playerMap={playerMap} courtNum={i + 1} done={done}
                  onClick={() => toggleMatchDone(currentRound, m.id)} />
              );
            })}

            <div style={{ fontSize: 11, color: C.muted, textAlign: "center", marginBottom: 14 }}>
              カードをタップで完了マーク
            </div>

            {/* 前後ナビ */}
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={() => setCurrentRound(r => Math.max(0, r - 1))} disabled={currentRound === 0} style={{
                flex: 1, padding: "13px", borderRadius: 12,
                background: currentRound === 0 ? C.border : C.card,
                color: currentRound === 0 ? C.muted : C.court,
                border: `2px solid ${currentRound === 0 ? C.border : C.court}`,
                fontWeight: 700, fontSize: 14, cursor: currentRound === 0 ? "not-allowed" : "pointer",
              }}>← 前へ</button>
              <button onClick={() => setCurrentRound(r => Math.min(totalRounds - 1, r + 1))} disabled={currentRound >= totalRounds - 1} style={{
                flex: 1, padding: "13px", borderRadius: 12,
                background: currentRound >= totalRounds - 1 ? C.border : `linear-gradient(135deg, ${C.ball} 0%, ${C.ballDk} 100%)`,
                color: currentRound >= totalRounds - 1 ? C.muted : C.dark,
                border: "none", fontWeight: 700, fontSize: 14,
                cursor: currentRound >= totalRounds - 1 ? "not-allowed" : "pointer",
                boxShadow: currentRound < totalRounds - 1 ? "0 3px 12px rgba(200,230,60,0.35)" : "none",
              }}>次へ →</button>
            </div>

            {/* ラウンド一覧 */}
            <div style={{ background: C.card, borderRadius: 14, marginTop: 14, padding: "14px 16px", boxShadow: "0 1px 8px rgba(0,0,0,0.06)" }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 10 }}>全ラウンド</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {rounds.map((_, i) => {
                  const done      = isRoundDone(i);
                  const isCurrent = i === currentRound;
                  return (
                    <button key={i} onClick={() => setCurrentRound(i)} style={{
                      width: 36, height: 36, borderRadius: 8, border: "none",
                      background: isCurrent ? C.court : done ? C.ball : C.bg,
                      color: isCurrent ? C.line : done ? C.dark : C.muted,
                      fontWeight: 800, fontSize: 13, cursor: "pointer",
                      boxShadow: isCurrent ? "0 2px 8px rgba(0,0,0,0.2)" : "none",
                    }}>{i + 1}</button>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
